<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Monitor – Educational Dashboard</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#1a1a1a; color:#e0e0e0; font-family:'Courier New', monospace; height:100vh; display:flex; flex-direction:column; }
  .toolbar { background:#222; padding:10px 20px; display:flex; gap:10px; align-items:center; border-bottom:2px solid #c75b2c; }
  .toolbar button { background:#3a3329; color:#e8dfd2; border:1px solid #555; padding:8px 16px; border-radius:6px; cursor:pointer; font-weight:bold; }
  .toolbar button:hover { background:#c75b2c; color:#fff; }
  .toolbar button.recording { background:#c0392b; }
  .toolbar .status { margin-left:auto; font-size:0.9em; }
  .log-container { flex:1; overflow-y:auto; padding:15px; background:#0d0d0d; }
  .log-entry { font-size:0.9em; line-height:1.5; border-bottom:1px solid #2a2a2a; padding:4px 0; white-space:pre-wrap; word-break:break-word; }
  .log-entry .time { color:#888; margin-right:10px; }
  .log-entry .source { color:#c75b2c; margin-right:8px; }
  .log-entry.log   { color:#b8b8b8; }
  .log-entry.warn  { color:#f0ad4e; }
  .log-entry.error { color:#e74c3c; font-weight:bold; }
  .log-entry.info  { color:#3498db; }
  .log-entry.debug { color:#888; }
  .log-entry.network { color:#2ecc71; }
  .clear-btn { background:#444; }
  .filters { display:flex; gap:5px; margin-left:20px; }
  .filters button { padding:5px 10px; font-size:0.8em; }
  .filters button.active { background:#c75b2c; color:#fff; }
</style>
</head>
<body>
<div class="toolbar">
  <button id="startBtn">▶ Start Recording</button>
  <button id="stopBtn" disabled>⏹ Stop Recording</button>
  <button id="clearBtn" class="clear-btn">🗑 Clear</button>
  <button id="loadBtn">📂 Load Recent Logs</button>
  <div class="filters">
    <button data-level="all" class="active">All</button>
    <button data-level="error">Errors</button>
    <button data-level="warn">Warnings</button>
    <button data-level="log">Logs</button>
    <button data-level="network">Network</button>
  </div>
  <span class="status" id="status">⚪ Idle</span>
</div>
<div class="log-container" id="logContainer"></div>
<script>
  (function() {
    const DB_NAME = 'adminMonitorDB_v2';
    const DB_VERSION = 2;
    const CHANNEL_NAME = 'app-monitor';

    const logContainer = document.getElementById('logContainer');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const clearBtn = document.getElementById('clearBtn');
    const loadBtn = document.getElementById('loadBtn');
    const status = document.getElementById('status');

    let channel = null, recording = false, currentFilter = 'all';

    function applyFilter() {
      document.querySelectorAll('.log-entry').forEach(entry => {
        entry.style.display = (currentFilter === 'all' || entry.dataset.level === currentFilter) ? '' : 'none';
      });
    }

    document.querySelectorAll('.filters button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.level;
        applyFilter();
      });
    });

    // IndexedDB helpers
    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('actions')) db.createObjectStore('actions', { keyPath: 'id', autoIncrement: true });
          if (!db.objectStoreNames.contains('errors')) db.createObjectStore('errors', { keyPath: 'id', autoIncrement: true });
          if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'key' });
        };
        request.onsuccess = (e) => resolve(e.target.result);
        request.onerror = (e) => reject(e.target.error);
      });
    }

    async function fetchRecentLogs(limit = 50) {
      const db = await openDB();
      const logs = [];
      await new Promise((resolve, reject) => {
        const tx = db.transaction('errors', 'readonly');
        const store = tx.objectStore('errors');
        const req = store.openCursor(null, 'prev');
        req.onsuccess = (e) => {
          const cursor = e.target.result;
          if (cursor && logs.length < limit) { logs.push({ ...cursor.value, store: 'errors' }); cursor.continue(); }
          else resolve();
        };
        req.onerror = reject;
      });
      await new Promise((resolve, reject) => {
        const tx = db.transaction('actions', 'readonly');
        const store = tx.objectStore('actions');
        const req = store.openCursor(null, 'prev');
        req.onsuccess = (e) => {
          const cursor = e.target.result;
          if (cursor && logs.length < limit) { logs.push({ ...cursor.value, store: 'actions' }); cursor.continue(); }
          else resolve();
        };
        req.onerror = reject;
      });
      logs.sort((a,b) => (a.timestamp||'').localeCompare(b.timestamp||''));
      return logs.slice(0, limit);
    }

    function appendLog(entry) {
      const div = document.createElement('div');
      const time = new Date(entry.timestamp || Date.now()).toLocaleTimeString();
      div.className = `log-entry ${entry.level || 'log'}`;
      div.dataset.level = entry.level || 'log';
      div.innerHTML = `<span class="time">${time}</span><span class="source">[${entry.source||'?'}]</span>${escapeHtml(entry.message||'')}`;
      logContainer.appendChild(div);
      if (currentFilter !== 'all' && currentFilter !== entry.level) div.style.display = 'none';
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    function escapeHtml(text) { return String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    startBtn.addEventListener('click', () => {
      if (recording) return;
      recording = true;
      startBtn.disabled = true;
      stopBtn.disabled = false;
      status.textContent = '🔴 Recording';
      channel = new BroadcastChannel(CHANNEL_NAME);
      channel.onmessage = (event) => {
        if (event.data?.type === 'log-entry') appendLog(event.data.payload);
      };
    });

    stopBtn.addEventListener('click', () => {
      if (!recording) return;
      recording = false;
      startBtn.disabled = false;
      stopBtn.disabled = true;
      status.textContent = '⚪ Idle';
      if (channel) { channel.close(); channel = null; }
    });

    clearBtn.addEventListener('click', () => { logContainer.innerHTML = ''; });

    loadBtn.addEventListener('click', async () => {
      loadBtn.disabled = true;
      loadBtn.textContent = 'Loading...';
      try {
        const logs = await fetchRecentLogs(50);
        logs.reverse().forEach(entry => appendLog({
          level: entry.store==='errors'?'error':entry.level||'log',
          message: entry.message,
          source: entry.source||'db',
          timestamp: entry.timestamp
        }));
      } catch (err) {
        appendLog({ level:'error', message:'Failed to load logs: '+err.message, source:'monitor', timestamp:new Date().toISOString() });
      }
      loadBtn.disabled = false;
      loadBtn.textContent = '📂 Load Recent Logs';
    });

    stopBtn.disabled = true;
  })();
</script>
</body>
</html>
