<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="index_title">Educational Dashboard – French | Lessons, Review, Tests</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="shared.css">
  <style>
    :root {
      --shadow: 0 2px 8px rgba(0,0,0,0.04);
      --shadow-hover: 0 10px 25px rgba(0,0,0,0.08);
      --subcard-bg: #fdf9f4;
      --muted: #aaa;
      --revision-card-gradient-start: #fdf6ed;
    }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background var(--transition), color var(--transition);
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem 1.5rem 3rem;
    }
    h1 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 0.5rem;
      color: var(--text);
    }
    .subtitle {
      text-align: center;
      color: var(--text-light);
      margin-bottom: 2.5rem;
      font-size: 1rem;
    }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.5rem;
    }
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      transition: all var(--transition);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: default;
    }
    .card:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }
    /* Keyboard focus matches hover exactly */
    .card:focus-visible {
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
      outline: 2px solid var(--accent);
    }
    .card-header {
      padding: 1rem 1.2rem;
      font-weight: 700;
      font-size: 1.1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--text);
    }
    .card-body {
      padding: 1rem 1.2rem;
      flex:1;
      color: var(--text-light);
      font-size: 0.9rem;
    }
    .coming-soon {
      color: var(--muted);
      font-style: italic;
      display: flex;
      align-items: center;
      gap:0.4rem;
    }
    .badge {
      display: inline-block;
      background: var(--accent);
      color: var(--white);
      padding: 0.2rem 0.7rem;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .sections-list {
      list-style: none;
      margin-top: 0.5rem;
    }
    .sections-list li {
      background: var(--subcard-bg);
      margin-bottom: 0.4rem;
      padding: 0.5rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
      border: 1px solid var(--border);
      color: var(--text-light);
    }
    .expand-btn {
      background: none;
      border: none;
      color: var(--accent);
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
      margin-top: 0.3rem;
      text-decoration: underline;
      transition: color var(--transition);
    }
    .expand-btn:hover { color: var(--accent-hover); }
    .card.revision {
      border: 2px solid var(--accent);
      background: linear-gradient(145deg, var(--revision-card-gradient-start), var(--card-bg));
    }
    .card.revision .card-header {
      background: var(--accent);
      color: var(--white);
      border-bottom: none;
    }
    .card.revision .card-body { font-weight: 500; }
    .card.revision a {
      display: inline-block;
      margin-top: 0.8rem;
      background: var(--accent);
      color: var(--white);
      padding: 0.5rem 1.2rem;
      border-radius: 20px;
      text-decoration: none;
      font-weight: 600;
      transition: background var(--transition);
    }
    .card.revision a:hover { background: var(--accent-hover); }
    @media (max-width:600px) {
      .cards-grid { grid-template-columns: 1fr; }
      h1 { font-size: 1.5rem; }
    }
  </style>
</head>
