<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réinitialisation du mot de passe</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .reset-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      padding: 2rem;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .reset-card h2 { margin-bottom: 1rem; }
    .reset-card input {
      width: 100%;
      padding: 0.75rem;
      margin: 0.75rem 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text);
      font-size: 1rem;
    }
    .reset-card button {
      width: 100%;
      padding: 0.75rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 1rem;
    }
    .reset-card button:hover { background: var(--accent-hover); }
    .msg { margin-top: 1rem; font-size: 0.9rem; }
    .msg.success { color: var(--success); }
    .msg.error { color: var(--danger); }
  </style>
</head>
<body>
  <div class="reset-card">
    <h2>Nouveau mot de passe</h2>
    <p>Veuillez entrer votre nouveau mot de passe (6 caractères minimum).</p>
    <input type="password" id="new-password" placeholder="Nouveau mot de passe" autocomplete="new-password" minlength="6">
    <div id="strength-bar" style="display:none; margin:0.5rem 0;">
      <div class="strength-bar" id="strengthBar" style="width:0;"></div>
    </div>
    <span id="strengthText" style="display:none;"></span>
    <button id="reset-submit">Réinitialiser le mot de passe</button>
    <div id="message" class="msg"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
 <script>
  (function() {
    console.log('[Reset] Page loaded. Full URL:', window.location.href);
    console.log('[Reset] Hash:', window.location.hash);

    const SUPABASE_URL = 'https://bdzvznaoqqfajzuevqyz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkenZ6bmFvcXFmYWp6dWV2cXl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxODgwNTUsImV4cCI6MjEwMDc2NDA1NX0.mex6LAye9Q-QZPJutCb928Ih1IqFZ-wUbYR02Mg3Ols';

    console.log('[Reset] Creating Supabase client with detectSessionInUrl: false');
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      detectSessionInUrl: false
    });

    const passwordInput = document.getElementById('new-password');
    const resetBtn = document.getElementById('reset-submit');
    const messageDiv = document.getElementById('message');
    const strengthBar = document.getElementById('strengthBar');
    const strengthText = document.getElementById('strengthText');

    passwordInput.addEventListener('input', () => {
      const val = passwordInput.value;
      document.getElementById('strength-bar').style.display = val ? 'block' : 'none';
      strengthText.style.display = val ? 'block' : 'none';
      if (!val) return;
      let score = 0;
      if (val.length >= 6) score++;
      if (val.length >= 10) score++;
      if (/[a-z]/.test(val) && /[A-Z]/.test(val)) score++;
      if (/\d/.test(val)) score++;
      if (/[^a-zA-Z0-9]/.test(val)) score++;
      let width, color, text;
      if (score <= 1) { width = '33%'; color = 'var(--danger)'; text = 'Faible'; }
      else if (score <= 3) { width = '66%'; color = '#f0ad4e'; text = 'Moyen'; }
      else { width = '100%'; color = 'var(--success)'; text = 'Fort'; }
      strengthBar.style.width = width;
      strengthBar.style.background = color;
      strengthText.textContent = text;
    });

    function showMessage(msg, type) {
      messageDiv.textContent = msg;
      messageDiv.className = 'msg ' + (type || '');
    }

    // Read hash after a tiny delay to be absolutely sure it hasn't been removed
    setTimeout(() => {
      console.log('[Reset] Hash after 100ms:', window.location.hash);
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);
      const accessToken = params.get('access_token');
      const refreshToken = params.get('refresh_token');

      console.log('[Reset] access_token found?', !!accessToken);
      console.log('[Reset] refresh_token found?', !!refreshToken);

      if (accessToken) {
        console.log('[Reset] Calling setSession with the extracted token...');
        supabase.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken
        }).then(({ data: { session }, error }) => {
          console.log('[Reset] setSession result – error:', error);
          console.log('[Reset] setSession result – session:', session);
          if (error || !session) {
            showMessage('Lien de réinitialisation invalide ou expiré.', 'error');
            resetBtn.disabled = true;
            console.log('[Reset] Button disabled because no valid session');
            return;
          }
          console.log('[Reset] Session is valid. Enabling reset button.');
          resetBtn.disabled = false;
          resetBtn.textContent = 'Réinitialiser le mot de passe';

          resetBtn.addEventListener('click', async () => {
            console.log('[Reset] Reset button clicked');
            const password = passwordInput.value;
            if (password.length < 6) {
              showMessage('Le mot de passe doit contenir au moins 6 caractères.', 'error');
              console.log('[Reset] Password too short');
              return;
            }
            resetBtn.disabled = true;
            resetBtn.textContent = 'Mise à jour en cours…';
            console.log('[Reset] Calling updateUser...');
            const { error } = await supabase.auth.updateUser({ password });
            console.log('[Reset] updateUser error:', error);
            if (error) {
              showMessage('Erreur : ' + error.message, 'error');
              resetBtn.disabled = false;
              resetBtn.textContent = 'Réinitialiser le mot de passe';
            } else {
              showMessage('Mot de passe réinitialisé avec succès. Redirection…', 'success');
              passwordInput.disabled = true;
              setTimeout(() => { window.location.href = 'index.html'; }, 3000);
            }
          });
        });
      } else {
        console.log('[Reset] No access token found in hash – cannot proceed.');
        showMessage('Aucun token de réinitialisation trouvé dans le lien.', 'error');
        resetBtn.disabled = true;
      }
    }, 100);

    // Also listen to auth state changes for debugging
    supabase.auth.onAuthStateChange((event, session) => {
      console.log('[Reset] Auth state change – event:', event);
      console.log('[Reset] Auth state change – session:', session);
    });
  })();
</script>
</body>
</html>
