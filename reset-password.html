<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="reset_title">Réinitialisation du mot de passe</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .reset-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      padding: 2rem;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .reset-card h2 { margin-bottom: 1rem; }
    .reset-card input {
      width: 100%;
      padding: 0.75rem;
      margin: 0.75rem 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text);
      font-size: 1rem;
    }
    .reset-card button {
      width: 100%;
      padding: 0.75rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 1rem;
    }
    .reset-card button:hover { background: var(--accent-hover); }
    .msg { margin-top: 1rem; font-size: 0.9rem; }
    .msg.success { color: var(--success); }
    .msg.error { color: var(--danger); }
    .strength-bar {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0.5rem 0;
      overflow: hidden;
    }
    .strength-bar div {
      height: 100%;
      width: 0;
      border-radius: 2px;
      transition: width 0.3s, background 0.3s;
    }
  </style>
</head>
<body>
  <div class="reset-card">
    <h2 data-i18n="reset_heading">Nouveau mot de passe</h2>
    <p data-i18n="reset_instructions">Veuillez entrer votre nouveau mot de passe (6 caractères minimum).</p>
    <form onsubmit="return false;">
      <input type="password" id="new-password"
             data-i18n-placeholder="reset_placeholder"
             placeholder="Nouveau mot de passe"
             autocomplete="new-password" minlength="6">
    </form>
    <div class="strength-bar" id="strength-bar">
      <div id="strengthBar"></div>
    </div>
    <span id="strengthText"></span>
    <button id="reset-submit" disabled data-i18n="reset_button">Réinitialiser le mot de passe</button>
    <div id="message" class="msg"></div>
  </div>

  <script src="i18n.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (function() {
      // ── Register translations for the reset page ──
      App.addI18nTranslations({
        fr: {
          reset_title: 'Réinitialisation du mot de passe',
          reset_heading: 'Nouveau mot de passe',
          reset_instructions: 'Veuillez entrer votre nouveau mot de passe (6 caractères minimum).',
          reset_placeholder: 'Nouveau mot de passe',
          reset_button: 'Réinitialiser le mot de passe',
          reset_button_loading: 'Mise à jour en cours…',
          reset_success: 'Mot de passe réinitialisé avec succès. Redirection…',
          reset_error_prefix: 'Erreur : ',
          reset_password_short: 'Le mot de passe doit contenir au moins 6 caractères.',
          reset_link_invalid: 'Lien invalide ou expiré. Redirection…',
          strength_weak: 'Faible',
          strength_medium: 'Moyen',
          strength_strong: 'Fort'
        },
        en: {
          reset_title: 'Reset Password',
          reset_heading: 'New Password',
          reset_instructions: 'Please enter your new password (minimum 6 characters).',
          reset_placeholder: 'New password',
          reset_button: 'Reset Password',
          reset_button_loading: 'Updating…',
          reset_success: 'Password reset successfully. Redirecting…',
          reset_error_prefix: 'Error: ',
          reset_password_short: 'Password must be at least 6 characters.',
          reset_link_invalid: 'Invalid or expired link. Redirecting…',
          strength_weak: 'Weak',
          strength_medium: 'Medium',
          strength_strong: 'Strong'
        },
        ar: {
          reset_title: 'إعادة تعيين كلمة المرور',
          reset_heading: 'كلمة مرور جديدة',
          reset_instructions: 'يرجى إدخال كلمة المرور الجديدة (6 أحرف على الأقل).',
          reset_placeholder: 'كلمة المرور الجديدة',
          reset_button: 'إعادة تعيين كلمة المرور',
          reset_button_loading: 'جارٍ التحديث…',
          reset_success: 'تمت إعادة تعيين كلمة المرور بنجاح. جارٍ التوجيه…',
          reset_error_prefix: 'خطأ: ',
          reset_password_short: 'يجب أن تتكون كلمة المرور من 6 أحرف على الأقل.',
          reset_link_invalid: 'الرابط غير صالح أو منتهي الصلاحية. جارٍ التوجيه…',
          strength_weak: 'ضعيف',
          strength_medium: 'متوسط',
          strength_strong: 'قوي'
        }
      });

      // ── Apply saved language ──
      const lang = localStorage.getItem('lang') || 'fr';
      App.applyTranslations(lang);

      // ── Helper to translate a key ──
      function t(key) {
        return App.getTranslation(key, lang) || key;
      }

      // ── Supabase client ──
      const SUPABASE_URL = 'https://bdzvznaoqqfajzuevqyz.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkenZ6bmFvcXFmYWp6dWV2cXl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxODgwNTUsImV4cCI6MjEwMDc2NDA1NX0.mex6LAye9Q-QZPJutCb928Ih1IqFZ-wUbYR02Mg3Ols';
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const passwordInput = document.getElementById('new-password');
      const resetBtn = document.getElementById('reset-submit');
      const messageDiv = document.getElementById('message');
      const strengthBar = document.getElementById('strengthBar');
      const strengthText = document.getElementById('strengthText');

      // ── Password strength meter ──
      passwordInput.addEventListener('input', () => {
        const val = passwordInput.value;
        document.getElementById('strength-bar').style.display = val ? 'block' : 'none';
        strengthText.style.display = val ? 'block' : 'none';
        if (!val) return;
        let score = 0;
        if (val.length >= 6) score++;
        if (val.length >= 10) score++;
        if (/[a-z]/.test(val) && /[A-Z]/.test(val)) score++;
        if (/\d/.test(val)) score++;
        if (/[^a-zA-Z0-9]/.test(val)) score++;
        let width, color, textKey;
        if (score <= 1) {
          width = '33%'; color = 'var(--danger)'; textKey = 'strength_weak';
        } else if (score <= 3) {
          width = '66%'; color = '#f0ad4e'; textKey = 'strength_medium';
        } else {
          width = '100%'; color = 'var(--success)'; textKey = 'strength_strong';
        }
        strengthBar.style.width = width;
        strengthBar.style.background = color;
        strengthText.textContent = t(textKey);
      });

      function showMessage(msg, type) {
        messageDiv.textContent = msg;
        messageDiv.className = 'msg ' + (type || '');
      }

      // ── Token handling ──
      let tokenHandled = false;

      // Fallback: if no event after 3s → error
      setTimeout(() => {
        if (!tokenHandled && resetBtn.disabled) {
          showMessage(t('reset_link_invalid'), 'error');
          setTimeout(() => { window.location.href = 'index.html'; }, 2000);
        }
      }, 3000);

      supabase.auth.onAuthStateChange((event, session) => {
        if (event === 'PASSWORD_RECOVERY' && session) {
          tokenHandled = true;
          resetBtn.disabled = false;
          resetBtn.textContent = t('reset_button');

          resetBtn.addEventListener('click', async () => {
            const password = passwordInput.value;
            if (password.length < 6) {
              showMessage(t('reset_password_short'), 'error');
              return;
            }
            resetBtn.disabled = true;
            resetBtn.textContent = t('reset_button_loading');
            const { error } = await supabase.auth.updateUser({ password });
            if (error) {
              showMessage(t('reset_error_prefix') + error.message, 'error');
              resetBtn.disabled = false;
              resetBtn.textContent = t('reset_button');
            } else {
              showMessage(t('reset_success'), 'success');
              passwordInput.disabled = true;
              setTimeout(() => { window.location.href = 'index.html'; }, 3000);
            }
          });
        }
      });
    })();
  </script>
</body>
</html>
