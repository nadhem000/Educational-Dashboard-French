<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réinitialisation du mot de passe</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .reset-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      padding: 2rem;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .reset-card h2 { margin-bottom: 1rem; }
    .reset-card input {
      width: 100%;
      padding: 0.75rem;
      margin: 0.75rem 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text);
      font-size: 1rem;
    }
    .reset-card button {
      width: 100%;
      padding: 0.75rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 1rem;
    }
    .reset-card button:hover { background: var(--accent-hover); }
    .msg { margin-top: 1rem; font-size: 0.9rem; }
    .msg.success { color: var(--success); }
    .msg.error { color: var(--danger); }
  </style>
</head>
<body>
  <div class="reset-card">
    <h2 data-i18n="reset_title">Nouveau mot de passe</h2>
    <p data-i18n="reset_instructions">Veuillez entrer votre nouveau mot de passe (6 caractères minimum).</p>
    <input type="password" id="new-password" placeholder="Nouveau mot de passe" autocomplete="new-password" minlength="6">
    <div id="strength-bar" class="password-strength" style="display:none; margin:0.5rem 0;">
      <div class="strength-bar" id="strengthBar" style="width:0;"></div>
    </div>
    <span id="strengthText" class="strength-text" style="display:none;"></span>
    <button id="reset-submit" data-i18n="reset_button">Réinitialiser le mot de passe</button>
    <div id="message" class="msg"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Initialize Supabase (same credentials as supabase-client.js)
    const SUPABASE_URL = 'https://bdzvznaoqqfajzuevqyz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkenZ6bmFvcXFmYWp6dWV2cXl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxODgwNTUsImV4cCI6MjEwMDc2NDA1NX0.mex6LAye9Q-QZPJutCb928Ih1IqFZ-wUbYR02Mg3Ols';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const messageDiv = document.getElementById('message');
    const passwordInput = document.getElementById('new-password');
    const resetBtn = document.getElementById('reset-submit');
    const strengthBar = document.getElementById('strengthBar');
    const strengthText = document.getElementById('strengthText');

    // Strength meter (simple)
    passwordInput.addEventListener('input', () => {
      const val = passwordInput.value;
      document.getElementById('strength-bar').style.display = val ? 'block' : 'none';
      strengthText.style.display = val ? 'block' : 'none';
      if (!val) return;
      let score = 0;
      if (val.length >= 6) score++;
      if (val.length >= 10) score++;
      if (/[a-z]/.test(val) && /[A-Z]/.test(val)) score++;
      if (/\d/.test(val)) score++;
      if (/[^a-zA-Z0-9]/.test(val)) score++;
      let width, color, text;
      if (score <= 1) { width = '33%'; color = 'var(--danger)'; text = 'Faible'; }
      else if (score <= 3) { width = '66%'; color = '#f0ad4e'; text = 'Moyen'; }
      else { width = '100%'; color = 'var(--success)'; text = 'Fort'; }
      strengthBar.style.width = width;
      strengthBar.style.background = color;
      strengthText.textContent = text;
    });

    // Extract the recovery token from the URL hash
    async function handlePasswordReset() {
      try {
        // Supabase puts the access token in the URL hash after recovery
        const { data, error } = await supabase.auth.getSessionFromUrl();
        // Actually, getSessionFromUrl is deprecated; we need to use onAuthStateChange or manually parse.
        // But the easiest way is to use supabase.auth.onAuthStateChange to catch the recovery event.
        // However, we need the session to update the password. We'll listen for the event.
      } catch (e) {
        showMessage('Lien de réinitialisation invalide ou expiré.', 'error');
      }
    }

    // Better: listen for auth state changes – the recovery will trigger a USER_UPDATED or SIGNED_IN event.
    supabase.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        // The user is now allowed to update password
        resetBtn.addEventListener('click', async () => {
          const password = passwordInput.value;
          if (password.length < 6) {
            showMessage('Le mot de passe doit contenir au moins 6 caractères.', 'error');
            return;
          }
          const { data, error } = await supabase.auth.updateUser({ password });
          if (error) {
            showMessage('Erreur : ' + error.message, 'error');
          } else {
            showMessage('Mot de passe réinitialisé avec succès. Vous pouvez maintenant vous connecter.', 'success');
            passwordInput.disabled = true;
            resetBtn.disabled = true;
            // Redirect to index after 3 seconds
            setTimeout(() => { window.location.href = 'index.html'; }, 3000);
          }
        });
      }
    });

    function showMessage(msg, type) {
      messageDiv.textContent = msg;
      messageDiv.className = 'msg ' + (type || '');
    }

    // Initialise – Supabase will automatically parse the hash and trigger onAuthStateChange
    // We just need to call something to kick off the parsing (e.g., getSession).
    supabase.auth.getSession().then(() => {
      // After getSession, the recovery event will fire if the hash contains a recovery token
    });
  </script>
</body>
</html>
