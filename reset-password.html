<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réinitialisation du mot de passe</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .reset-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      padding: 2rem;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .reset-card h2 { margin-bottom: 1rem; }
    .reset-card input {
      width: 100%;
      padding: 0.75rem;
      margin: 0.75rem 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text);
      font-size: 1rem;
    }
    .reset-card button {
      width: 100%;
      padding: 0.75rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 1rem;
    }
    .reset-card button:hover { background: var(--accent-hover); }
    .msg { margin-top: 1rem; font-size: 0.9rem; }
    .msg.success { color: var(--success); }
    .msg.error { color: var(--danger); }
    .strength-bar {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0.5rem 0;
      overflow: hidden;
    }
    .strength-bar div {
      height: 100%;
      width: 0;
      border-radius: 2px;
      transition: width 0.3s, background 0.3s;
    }
  </style>
</head>
<body>
  <div class="reset-card">
    <h2>Nouveau mot de passe</h2>
    <p>Veuillez entrer votre nouveau mot de passe (6 caractères minimum).</p>
    <form onsubmit="return false;">
      <input type="password" id="new-password" placeholder="Nouveau mot de passe" autocomplete="new-password" minlength="6">
    </form>
    <div class="strength-bar" id="strength-bar">
      <div id="strengthBar"></div>
    </div>
    <span id="strengthText"></span>
    <button id="reset-submit" disabled>Réinitialiser le mot de passe</button>
    <div id="message" class="msg"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (function() {
      // Minimal capture just in case, but Supabase will also parse it automatically
      window.__recoveryHash = window.location.hash;

      const SUPABASE_URL = 'https://bdzvznaoqqfajzuevqyz.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkenZ6bmFvcXFmYWp6dWV2cXl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxODgwNTUsImV4cCI6MjEwMDc2NDA1NX0.mex6LAye9Q-QZPJutCb928Ih1IqFZ-wUbYR02Mg3Ols';
      // No custom options – let Supabase parse the URL automatically
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const passwordInput = document.getElementById('new-password');
      const resetBtn = document.getElementById('reset-submit');
      const messageDiv = document.getElementById('message');
      const strengthBar = document.getElementById('strengthBar');
      const strengthText = document.getElementById('strengthText');

      passwordInput.addEventListener('input', () => {
        const val = passwordInput.value;
        document.getElementById('strength-bar').style.display = val ? 'block' : 'none';
        strengthText.style.display = val ? 'block' : 'none';
        if (!val) return;
        let score = 0;
        if (val.length >= 6) score++;
        if (val.length >= 10) score++;
        if (/[a-z]/.test(val) && /[A-Z]/.test(val)) score++;
        if (/\d/.test(val)) score++;
        if (/[^a-zA-Z0-9]/.test(val)) score++;
        let width, color, text;
        if (score <= 1) { width = '33%'; color = 'var(--danger)'; text = 'Faible'; }
        else if (score <= 3) { width = '66%'; color = '#f0ad4e'; text = 'Moyen'; }
        else { width = '100%'; color = 'var(--success)'; text = 'Fort'; }
        strengthBar.style.width = width;
        strengthBar.style.background = color;
        strengthText.textContent = text;
      });

      function showMessage(msg, type) {
        messageDiv.textContent = msg;
        messageDiv.className = 'msg ' + (type || '');
      }

      // Fallback: if no event fires within 3 seconds and button still disabled, show error and redirect
      let tokenHandled = false;
      setTimeout(() => {
        if (!tokenHandled && resetBtn.disabled) {
          showMessage('Lien invalide ou expiré. Redirection…', 'error');
          setTimeout(() => { window.location.href = 'index.html'; }, 2000);
        }
      }, 3000);

      // Listen for the PASSWORD_RECOVERY event
      supabase.auth.onAuthStateChange((event, session) => {
        if (event === 'PASSWORD_RECOVERY' && session) {
          tokenHandled = true;
          resetBtn.disabled = false;
          resetBtn.textContent = 'Réinitialiser le mot de passe';

          resetBtn.addEventListener('click', async () => {
            const password = passwordInput.value;
            if (password.length < 6) {
              showMessage('Le mot de passe doit contenir au moins 6 caractères.', 'error');
              return;
            }
            resetBtn.disabled = true;
            resetBtn.textContent = 'Mise à jour en cours…';
            const { error } = await supabase.auth.updateUser({ password });
            if (error) {
              showMessage('Erreur : ' + error.message, 'error');
              resetBtn.disabled = false;
              resetBtn.textContent = 'Réinitialiser le mot de passe';
            } else {
              showMessage('Mot de passe réinitialisé avec succès. Redirection…', 'success');
              passwordInput.disabled = true;
              setTimeout(() => { window.location.href = 'index.html'; }, 3000);
            }
          });
        }
      });
    })();
  </script>
</body>
</html>
